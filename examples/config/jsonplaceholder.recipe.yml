# A portable recipe with a minimal configuration and several endpoints.
# See the multiple_endpoints.rb example

jsonplaceholder:
  recipe:
    name: jsonplaceholder
    version: 1.0.0
    format: 1
  host: jsonplaceholder.typicode.com

  endpoints:
    users:                      # This creates the endpoints: '/user' and '/users/:user_id'
      endpoints:
        show:
          path: /:user_id

    posts:                      # This creates the endpoints: '/posts', '/posts/:post_id', '/posts/:post_id/comments', '/posts/:post_id/comments/:comment_id'
      endpoints:
        show:
          path: /:post_id

        comments:
          path: /:post_id/comments
          endpoints:
            show:
              path: /:comment_id
