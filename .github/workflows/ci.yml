name: CI
on:
  push:
    branches: [develop, master, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ['2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0']
        # '' leaves Ruby's own default uri gem in place
        uri: ['', '< 1.0', '~> 1.0']
    env:
      URI_VERSION: ${{ matrix.uri }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
